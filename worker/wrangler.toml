# 巡风 · 手机直连交易所用的 Worker
#
# 部署之前至少要设三个 secret（都不写在这个文件里）：
#   pnpm -F @xf-rine/worker exec wrangler secret put REMOTE_TOKEN      # 手机连 Worker 的口令
#   pnpm -F @xf-rine/worker exec wrangler secret put GATE_KEY
#   pnpm -F @xf-rine/worker exec wrangler secret put GATE_SECRET
# 走 Bitget 则改成 BITGET_KEY / BITGET_SECRET / BITGET_PASSPHRASE。

name = "xf-rine"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# 解锁令牌要跨请求记住，Worker 自己无状态，所以放 Durable Object
[[durable_objects.bindings]]
name = "ARM"
class_name = "ArmRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArmRoom"]

[vars]
# gate | bitget —— 一个 Worker 只连一家，和电脑上的口径一致
EXCHANGE = "gate"
# live | testnet
GATE_ENV = "live"
# 下单总开关。先设成 false 把行情和持仓看清楚，再改 true
LIVE_TRADING = "false"
# 单笔名义价值上限（USDT）。Worker 上没人盯着，这道闸是最后一道
MAX_NOTIONAL = "500"

[observability]
enabled = true

# 本地起服务时固定端口，免得每次换一个
[dev]
port = 8790
ip = "127.0.0.1"
