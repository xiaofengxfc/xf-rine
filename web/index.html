<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover：全面屏要画到状态栏和手势条底下。
      不写这一句，App 里那些 env(safe-area-inset-*) 全是 0，
      内容就整体缩在两条黑边里 —— 见 styles.css 里的 --inset-*。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0e12" />
    <title>巡风 · Gate 永续日内台</title>
    <!--
      主题要赶在第一帧之前贴上去。
      等 React 起来再贴的话，深色底会先闪一下再变白 —— 看着像页面抽了一下。
      读不到（隐私模式）就当深色，和 styles.css 里的默认值一致。
    -->
    <script>
      try {
        if (localStorage.getItem('xf-rine:theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#f4f6f9');
        }
      } catch (e) { /* 隐私模式下 localStorage 会抛，用默认深色 */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
