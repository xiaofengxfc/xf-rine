name: CI

# 以前没有任何自动化：改完靠手工敲 check 脚本，敲不全就等于没测。
# 这里只跑「离线、不需要密钥」的那部分，交易所相关的体检仍然手工跑。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (server + web)
        run: pnpm typecheck

      - name: Offline checks
        run: node tools/check-all.mjs
